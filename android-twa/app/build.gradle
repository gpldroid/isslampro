plugins {
    id "com.android.application"
}

// Signing keystore is provided securely by GitHub Actions.
def signingStore = System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "com.gpldroid.isslampro"
    compileSdk 36

    defaultConfig {
        applicationId "com.gpldroid.isslampro"
        minSdk 24 // Android Browser Helper 2.7.4 requirement
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (signingStore) {
                storeFile file(signingStore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
