plugins {
    id "com.android.application"
}

// Galaxy J7 compatibility build: Android WebView host, minSdk 21.
android {
    namespace "com.gpldroid.isslampro"
    compileSdk 36

    defaultConfig {
        applicationId "com.gpldroid.isslampro"
        // Android 5.0+; supports older Galaxy J7 models than the former TWA build.
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            def signingStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (signingStore) {
                storeFile file(signingStore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
