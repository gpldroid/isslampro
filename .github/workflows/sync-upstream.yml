name: Sync UltraQuran website source

on:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout original UltraQuran repository
        uses: actions/checkout@v4
        with:
          repository: K3bOra/UltraQuran
          ref: main
          path: upstream-source
          fetch-depth: 1

      - name: Copy the complete website (including data, images and fonts)
        run: |
          cp -a upstream-source/docs/. .
          rm -rf upstream-source

      - name: Point website metadata to this GitHub Pages site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          extensions = {".html", ".js", ".css", ".json", ".xml", ".svg", ".txt", ".md"}
          old = "https://k3bora.github.io/UltraQuran/"
          new = "https://gpldroid.github.io/isslampro/"
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit and push imported website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete UltraQuran website assets"
            git push origin HEAD:main
          else
            echo "Website source is already up to date."
          fi
